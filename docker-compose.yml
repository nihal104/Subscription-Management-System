services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: brightloop
      POSTGRES_PASSWORD: brightloop
      POSTGRES_DB: brightloop
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightloop"]
      interval: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgres://brightloop:brightloop@db:5432/brightloop
      JWT_SECRET: dev-secret-change-me
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
